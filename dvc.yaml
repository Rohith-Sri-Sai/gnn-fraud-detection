stages:
  preprocess:
    cmd: python -m src.data_engine
    deps:
    - src/data_engine.py
    - data/raw/tfinance/tfinance.pt
    params:
    - preprocess
    outs:
    - data/processed/graph.pt

  train:
    cmd: python -m src.trainer
    deps:
    - src/trainer.py
    - src/model.py
    - src/features.py
    - data/processed/graph.pt
    params:
    - train
    - alerts
    outs:
    - models/graph_sage_model.pt
    - outputs/registered_model.json:
        cache: false
    metrics:
    - metrics.json:
        cache: false

  promote:
    cmd: python -m src.promote
    deps:
    - src/promote.py
    - outputs/registered_model.json
    params:
    - promote
    outs:
    - outputs/promotion.json:
        cache: false
