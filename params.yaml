preprocess:
  data_path: data/raw/tfinance/tfinance.pt   # see src/convert_tfinance.py
  train_ratio: 0.4        # benchmark protocol (BWGNN, ICML 2022): stratified 40/20/40
  val_ratio: 0.2
  split_seed: 0

train:                    # tuned on mean val PR-AUC over split seeds 0-2 (test never used)
  label_trick: true       # neighbors' TRAINING labels as input features (own label always hidden)
  label_rate: 0.5
  hidden_channel: 128
  epochs: 500             # full-batch: one gradient step per epoch
  lr: 0.003
  weight_decay: 0.0001
  num_layers: 2
  dropout: 0.3
  residual: true
  norm: true
  aggr: mean
  pos_weight_power: 0.0   # unweighted loss: best for PR-AUC (weighting helps recall, not precision)
  scheduler: none
  seed: 42
  log_every: 10
  ensemble_size: 5        # seeds averaged into one registered model

alerts:
  target_precision: 0.90  # alert threshold = lowest score with >= 90% precision on VALIDATION

promote:
  alias: champion         # registry alias the API serves
  min_test_pr_auc: 0.90   # never promote a model below this

